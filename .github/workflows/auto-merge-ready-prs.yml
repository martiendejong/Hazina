# Conflict-Free Auto-Merge
# Automatically merge PRs when all quality gates pass and no conflicts exist
# Value: 60x (eliminates merge queue wait)
# Effort: LOW (2 days - git automation)
# ROI: 30:1

name: Auto-Merge Ready PRs

on:
  # Run when PR is updated
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

  # Run when checks complete
  check_suite:
    types: [completed]

  # Run when PR is approved
  pull_request_review:
    types: [submitted]

  # Manual trigger for stuck PRs
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to force-check'
        required: false

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr_number = context.payload.pull_request?.number || context.payload.inputs?.pr_number;

            if (!pr_number) {
              console.log('No PR number found, skipping');
              return { skip: true };
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr_number
            });

            // Get check runs
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: pr.head.sha
            });

            // Get reviews
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr_number
            });

            return {
              pr_number,
              skip: false,
              state: pr.state,
              mergeable: pr.mergeable,
              mergeable_state: pr.mergeable_state,
              draft: pr.draft,
              updated_at: pr.updated_at,
              base: pr.base.ref,
              head: pr.head.ref,
              checks: checks.check_runs,
              reviews: reviews,
              labels: pr.labels.map(l => l.name)
            };

      - name: Evaluate merge conditions
        id: evaluate
        uses: actions/github-script@v7
        with:
          script: |
            const prInfo = ${{ steps.pr.outputs.result }};

            if (prInfo.skip) {
              core.setOutput('ready', 'false');
              core.setOutput('reason', 'No PR to evaluate');
              return;
            }

            // Skip draft PRs
            if (prInfo.draft) {
              core.setOutput('ready', 'false');
              core.setOutput('reason', 'PR is draft');
              return;
            }

            // Skip PRs with 'do-not-merge' label
            if (prInfo.labels.includes('do-not-merge') || prInfo.labels.includes('wip')) {
              core.setOutput('ready', 'false');
              core.setOutput('reason', 'PR has do-not-merge or wip label');
              return;
            }

            // Check 1: Build success
            const buildChecks = prInfo.checks.filter(c =>
              c.name.toLowerCase().includes('build') ||
              c.name.toLowerCase().includes('compile')
            );
            const buildPassed = buildChecks.length === 0 || buildChecks.every(c => c.conclusion === 'success');

            // Check 2: Tests passing
            const testChecks = prInfo.checks.filter(c =>
              c.name.toLowerCase().includes('test')
            );
            const testsPassed = testChecks.length === 0 || testChecks.every(c => c.conclusion === 'success');

            // Check 3: All other checks passing
            const allChecksPassed = prInfo.checks.length === 0 ||
              prInfo.checks.every(c => c.conclusion === 'success' || c.conclusion === 'skipped');

            // Check 4: No merge conflicts
            const noConflicts = prInfo.mergeable === true &&
              (prInfo.mergeable_state === 'clean' || prInfo.mergeable_state === 'unstable');

            // Check 5: Has approval
            const approvals = prInfo.reviews.filter(r => r.state === 'APPROVED');
            const latestReviews = {};
            prInfo.reviews.forEach(r => {
              if (!latestReviews[r.user.login] || new Date(r.submitted_at) > new Date(latestReviews[r.user.login].submitted_at)) {
                latestReviews[r.user.login] = r;
              }
            });
            const currentApprovals = Object.values(latestReviews).filter(r => r.state === 'APPROVED');
            const hasApproval = currentApprovals.length > 0;

            // Check 6: Not stale (updated within 2 days)
            const updatedAt = new Date(prInfo.updated_at);
            const daysSinceUpdate = (Date.now() - updatedAt.getTime()) / (1000 * 60 * 60 * 24);
            const notStale = daysSinceUpdate < 2;

            // Aggregate results
            const conditions = {
              build: buildPassed,
              tests: testsPassed,
              all_checks: allChecksPassed,
              no_conflicts: noConflicts,
              approved: hasApproval,
              not_stale: notStale
            };

            const ready = Object.values(conditions).every(v => v);

            core.setOutput('ready', ready ? 'true' : 'false');
            core.setOutput('conditions', JSON.stringify(conditions));
            core.setOutput('pr_number', prInfo.pr_number);

            if (!ready) {
              const failed = Object.entries(conditions).filter(([k,v]) => !v).map(([k]) => k);
              core.setOutput('reason', `Failed conditions: ${failed.join(', ')}`);
            }

      - name: Auto-merge PR
        if: steps.evaluate.outputs.ready == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const pr_number = ${{ steps.evaluate.outputs.pr_number }};

            try {
              // Merge the PR
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr_number,
                merge_method: 'squash',
                commit_title: `Auto-merge PR #${pr_number}`,
                commit_message: 'All quality gates passed. Auto-merged by Conflict-Free Auto-Merge workflow.\n\nConditions met:\n✅ Build passed\n✅ Tests passed\n✅ All checks passed\n✅ No conflicts\n✅ Approved\n✅ Not stale\n\nPart of Autonomous Pipeline.'
              });

              // Comment on success
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr_number,
                body: '✅ **Auto-merged successfully**\n\nAll quality gates passed:\n- ✅ Build compilation\n- ✅ Unit tests\n- ✅ All checks\n- ✅ No merge conflicts\n- ✅ Approved by reviewer\n- ✅ Recently updated (<2 days)\n\nMerged automatically by Autonomous Pipeline (Conflict-Free Auto-Merge).'
              });

              console.log(`✅ PR #${pr_number} auto-merged successfully`);

            } catch (error) {
              console.error(`Failed to merge PR #${pr_number}:`, error.message);

              // Comment on failure
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr_number,
                body: `⚠️ **Auto-merge failed**\n\nAll conditions were met, but merge failed:\n\`\`\`\n${error.message}\n\`\`\`\n\nPlease merge manually.`
              });

              throw error;
            }

      - name: Report not ready
        if: steps.evaluate.outputs.ready == 'false' && steps.evaluate.outputs.pr_number
        uses: actions/github-script@v7
        with:
          script: |
            const pr_number = ${{ steps.evaluate.outputs.pr_number }};
            const reason = `${{ steps.evaluate.outputs.reason }}`;
            const conditions = JSON.parse(`${{ steps.evaluate.outputs.conditions }}`);

            console.log(`PR #${pr_number} not ready for auto-merge: ${reason}`);
            console.log('Conditions:', conditions);

            // Only comment if this was a manual trigger
            if (context.eventName === 'workflow_dispatch') {
              const status = Object.entries(conditions)
                .map(([k, v]) => `- ${v ? '✅' : '❌'} ${k.replace(/_/g, ' ')}`)
                .join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr_number,
                body: `⏳ **Not ready for auto-merge**\n\n${reason}\n\n**Current status:**\n${status}\n\nPR will auto-merge when all conditions are met.`
              });
            }

# Safety Features:
# - Skips draft PRs
# - Skips PRs with 'do-not-merge' or 'wip' labels
# - Requires all checks to pass
# - Requires no merge conflicts
# - Requires at least 1 approval
# - Only merges recently updated PRs (<2 days)
# - Uses squash merge (clean history)
# - Comments on success/failure
# - Can be triggered manually for stuck PRs
#
# Deployment:
# 1. Copy to .github/workflows/auto-merge-ready-prs.yml
# 2. Enable in repository (automatic on push)
# 3. PRs will auto-merge when conditions met
#
# To prevent auto-merge on specific PR:
# - Add 'do-not-merge' label, OR
# - Mark as draft, OR
# - Request changes in review
