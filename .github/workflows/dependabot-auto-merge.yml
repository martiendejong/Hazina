# Dependency Update Auto-Merge
# Automatically approve and merge Dependabot PRs when all checks pass
# Value: 50x (immediate security updates)
# Effort: LOW (copy to .github/workflows/ in each repo)

name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest

    # Only run on Dependabot PRs
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Check PR author
        id: check-author
        run: |
          if [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
            echo "is_dependabot=true" >> $GITHUB_OUTPUT
          else
            echo "is_dependabot=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        if: steps.check-author.outputs.is_dependabot == 'true'
        uses: actions/checkout@v4

      - name: Setup .NET
        if: steps.check-author.outputs.is_dependabot == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        if: steps.check-author.outputs.is_dependabot == 'true'
        run: dotnet restore

      - name: Build
        if: steps.check-author.outputs.is_dependabot == 'true'
        run: dotnet build --no-restore

      - name: Run tests
        if: steps.check-author.outputs.is_dependabot == 'true'
        run: dotnet test --no-build --verbosity normal

      - name: Auto-approve PR
        if: steps.check-author.outputs.is_dependabot == 'true' && success()
        run: |
          gh pr review ${{ github.event.pull_request.number }} --approve \
            --body "✅ Automated approval: All quality gates passed

          **Quality Gates:**
          - ✅ Build compilation: Passed
          - ✅ Unit tests: Passed
          - ✅ Dependency update: Security patch applied

          Auto-merging Dependabot PR per Autonomous Pipeline policy."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: steps.check-author.outputs.is_dependabot == 'true' && success()
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --auto \
            --squash \
            --delete-branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report failure
        if: steps.check-author.outputs.is_dependabot == 'true' && failure()
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "⚠️ Automated quality gates failed

          **Failed Gates:**
          - Build or tests failed

          Please review the CI logs and fix the issues.
          This PR will NOT be auto-merged until all gates pass."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Deployment Instructions:
# 1. Copy this file to .github/workflows/dependabot-auto-merge.yml in each repository
# 2. Enable Dependabot in repository settings
# 3. Enable "Allow auto-merge" in repository settings
# 4. Dependabot PRs will now auto-merge when tests pass
#
# Supported update types:
# - Security patches: Auto-merged immediately
# - Minor version bumps: Auto-merged if tests pass
# - Major version bumps: Auto-merged if tests pass (review breaking changes manually if needed)
#
# Safety:
# - Only runs on Dependabot PRs (not human PRs)
# - Requires build + tests to pass
# - Squash merge keeps history clean
# - Auto-deletes merged branches
