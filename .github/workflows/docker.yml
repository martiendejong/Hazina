name: Docker Build and Push

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      push_images:
        description: 'Push images to registry'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    strategy:
      matrix:
        app:
          - name: claude-code
            path: apps/CLI/Hazina.App.ClaudeCode
            project: Hazina.App.ClaudeCode
          # Add more apps as needed
          # - name: web-app
          #   path: apps/Web/Hazina.App.HtmlMockupGenerator
          #   project: Hazina.App.HtmlMockupGenerator

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.app.name }}
        tags: |
          type=ref,event=branch,enable=${{ github.ref_type == 'branch' }}
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha,prefix=sha-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        build-args: |
          PROJECT_PATH=${{ matrix.app.path }}
          PROJECT_NAME=${{ matrix.app.project }}
        push: false
        load: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run Trivy security scan on Docker image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        format: 'sarif'
        output: 'trivy-docker-results.sarif'
        severity: 'CRITICAL,HIGH'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-docker-results.sarif'
        category: docker-${{ matrix.app.name }}

    - name: Test Docker image
      run: |
        # Basic health check
        docker run --rm \
          -e ASPNETCORE_ENVIRONMENT=Production \
          ${{ fromJSON(steps.meta.outputs.json).tags[0] }} \
          --version || true

    - name: Push Docker image
      if: |
        github.event_name != 'pull_request' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        build-args: |
          PROJECT_PATH=${{ matrix.app.path }}
          PROJECT_NAME=${{ matrix.app.project }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Generate SBOM
      if: github.event_name != 'pull_request'
      uses: anchore/sbom-action@v0
      with:
        image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        format: spdx-json
        output-file: sbom-${{ matrix.app.name }}.spdx.json

    - name: Upload SBOM
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v6
      with:
        name: sbom-${{ matrix.app.name }}
        path: sbom-${{ matrix.app.name }}.spdx.json
        retention-days: 90

  docker compose-test:
    name: Test Docker Compose Stack
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Start Docker Compose stack
      run: |
        docker compose up -d postgres redis jaeger prometheus
        sleep 10

    - name: Check service health
      run: |
        docker compose ps
        docker compose logs

    - name: Test PostgreSQL connection
      run: |
        docker compose exec -T postgres pg_isready -U hazina || exit 1

    - name: Test Redis connection
      run: |
        docker compose exec -T redis redis-cli ping || exit 1

    - name: Stop Docker Compose stack
      if: always()
      run: docker compose down -v
