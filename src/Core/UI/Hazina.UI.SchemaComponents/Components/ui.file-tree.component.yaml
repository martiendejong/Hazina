id: ui.file-tree
type: visualization
category: file
description: Displays hierarchical file and directory structure

schema:
  type: object
  required:
    - rootPath
    - items
  properties:
    rootPath:
      type: string
      description: Root directory path for this tree view
    items:
      type: array
      description: File/directory items to display
      items:
        type: object
        required:
          - path
          - name
          - type
        properties:
          path:
            type: string
            description: Full path to file or directory
          name:
            type: string
            description: Display name (file/directory name)
          type:
            type: string
            enum:
              - file
              - directory
          size:
            type: integer
            description: File size in bytes (files only)
          modified:
            type: string
            format: date-time
            description: Last modified timestamp (ISO 8601)
          extension:
            type: string
            description: File extension (files only)
          children:
            type: array
            description: Nested items for directories
    expandedPaths:
      type: array
      description: List of expanded directory paths
      items:
        type: string
    selectedPath:
      type: string
      description: Currently selected file/directory path

security:
  requiresApproval: false
  allowedOperations:
    - view
    - expand
    - collapse
    - select
  riskLevel: read
