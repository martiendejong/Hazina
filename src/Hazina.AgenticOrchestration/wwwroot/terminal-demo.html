<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Terminal - Hazina Agentic Orchestration</title>

    <!-- xterm.js CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
        }

        .app-container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        .sidebar {
            width: 250px;
            background: #161b22;
            border-right: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 1rem;
            border-bottom: 1px solid #30363d;
            font-weight: 600;
            font-size: 0.875rem;
            color: #8b949e;
            text-transform: uppercase;
        }

        .session-list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .session-list::-webkit-scrollbar {
            width: 8px;
        }

        .session-list::-webkit-scrollbar-track {
            background: #0d1117;
        }

        .session-list::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }

        .session-list::-webkit-scrollbar-thumb:hover {
            background: #8b949e;
        }

        .session-item {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #30363d;
            cursor: pointer;
            transition: background 0.2s;
            height: 80px;
            min-height: 80px;
            max-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        .session-item:hover {
            background: #21262d;
        }

        .session-item.active {
            background: #21262d;
            border-left: 3px solid #58a6ff;
        }

        .session-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: #c9d1d9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .session-meta {
            font-size: 0.75rem;
            color: #8b949e;
            margin-top: 0.25rem;
        }

        .session-status {
            display: inline-block;
            padding: 0.125rem 0.5rem;
            border-radius: 12px;
            font-size: 0.625rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .session-status.running {
            background: #238636;
            color: #fff;
        }

        .session-status.exited {
            background: #8b949e;
            color: #fff;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #161b22;
            padding: 1rem 2rem;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        header h1 span {
            color: #58a6ff;
        }

        .controls {
            display: flex;
            gap: 0.5rem;
        }

        button {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        button:hover {
            background: #30363d;
            border-color: #8b949e;
        }

        button.primary {
            background: #238636;
            border-color: #238636;
        }

        button.primary:hover {
            background: #2ea043;
        }

        button.danger {
            background: #da3633;
            border-color: #da3633;
        }

        button.danger:hover {
            background: #f85149;
        }

        /* Voice control button styles */
        button.voice {
            background: #21262d;
            border-color: #30363d;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        button.voice:hover {
            background: #30363d;
            border-color: #8b949e;
        }

        button.voice.recording {
            background: #da3633;
            border-color: #da3633;
            animation: pulse 1.5s ease-in-out infinite;
        }

        button.voice.recording:hover {
            background: #f85149;
        }

        button.voice .mic-icon {
            width: 16px;
            height: 16px;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                box-shadow: 0 0 0 0 rgba(218, 54, 51, 0.4);
            }
            50% {
                opacity: 0.8;
                box-shadow: 0 0 0 8px rgba(218, 54, 51, 0);
            }
        }

        /* Voice status indicator */
        .voice-status {
            font-size: 0.75rem;
            color: #8b949e;
            margin-left: 0.5rem;
        }

        .voice-status.listening {
            color: #f85149;
        }

        .voice-status.processing {
            color: #d29922;
        }

        .toolbar {
            background: #161b22;
            padding: 0.5rem 2rem;
            display: flex;
            gap: 1rem;
            align-items: center;
            border-bottom: 1px solid #30363d;
        }

        .toolbar label {
            font-size: 0.875rem;
            color: #8b949e;
        }

        .toolbar input, .toolbar select {
            background: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 0.375rem 0.75rem;
            border-radius: 6px;
            font-size: 0.875rem;
        }

        .toolbar input:focus, .toolbar select:focus {
            outline: none;
            border-color: #58a6ff;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1rem;
        }

        #terminal-container {
            flex: 1;
            background: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            min-height: 400px;
        }

        .status-bar {
            background: #161b22;
            padding: 0.5rem 2rem;
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #8b949e;
            border-top: 1px solid #30363d;
        }

        .status-bar .connected {
            color: #3fb950;
        }

        .status-bar .disconnected {
            color: #f85149;
        }

        .session-info {
            display: flex;
            gap: 2rem;
        }

        /* Mobile Back Button */
        .mobile-back {
            display: none;
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 1000;
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .mobile-back:hover {
            background: #30363d;
        }

        /* Mobile Responsive Layout */
        @media (max-width: 768px) {
            .app-container {
                position: relative;
            }

            .sidebar {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100vh;
                z-index: 100;
                border-right: none;
            }

            .main-content {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100vh;
                z-index: 10;
                display: none;
            }

            /* When session is active, hide sidebar and show terminal */
            .app-container.session-active .sidebar {
                display: none;
            }

            .app-container.session-active .main-content {
                display: flex;
            }

            .app-container.session-active .mobile-back {
                display: block;
            }

            /* Adjust header for mobile */
            header {
                padding: 1rem;
            }

            header h1 {
                font-size: 1.25rem;
            }

            .controls {
                flex-wrap: wrap;
                gap: 0.25rem;
            }

            button {
                padding: 0.375rem 0.75rem;
                font-size: 0.75rem;
            }

            .toolbar {
                padding: 0.5rem;
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            .toolbar label {
                display: none;
            }

            .toolbar input, .toolbar select {
                font-size: 0.75rem;
                padding: 0.25rem 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <button class="mobile-back" id="btn-back">← Sessions</button>
        <div class="sidebar">
            <div class="sidebar-header">Active Sessions</div>
            <div class="session-list" id="session-list">
                <!-- Sessions will be dynamically added here -->
            </div>
        </div>
        <div class="main-content">
    <header>
        <h1><span>Claude</span> Terminal</h1>
        <div class="controls">
            <button id="btn-voice" class="voice" title="Hold to speak (or click to toggle)">
                <svg class="mic-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
                <span id="voice-btn-text">Voice</span>
            </button>
            <span id="voice-status" class="voice-status"></span>
            <button id="btn-new-session" class="primary">New Session</button>
            <button id="btn-interrupt">Send Ctrl+C</button>
            <button id="btn-terminate" class="danger">Terminate</button>
        </div>
    </header>

    <div class="toolbar">
        <label>Command:</label>
        <input type="text" id="command" value="claude" placeholder="claude" style="width: 100px;">

        <label>Working Dir:</label>
        <input type="text" id="working-dir" value="C:\Projects" placeholder="C:\Projects" style="width: 200px;">

        <label>Arguments:</label>
        <input type="text" id="arguments" placeholder="--prompt 'Hello'" style="width: 250px;">
    </div>

    <main>
        <div id="terminal-container"></div>
    </main>

    <div class="status-bar">
        <div class="session-info">
            <span>Session: <span id="session-id">None</span></span>
            <span>Status: <span id="status" class="disconnected">Disconnected</span></span>
        </div>
        <div>
            <span>Hub: /hubs/terminal</span>
        </div>
    </div>

    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.8.0/lib/addon-fit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.9.0/lib/addon-web-links.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.0/dist/browser/signalr.min.js"></script>

    <script>
        // Terminal client implementation
        class ClaudeTerminal {
            constructor() {
                this.terminal = null;
                this.fitAddon = null;
                this.connection = null;
                this.currentSessionId = null;
                this.isConnected = false;
            }

            async init() {
                // Create terminal
                this.terminal = new Terminal({
                    cursorBlink: true,
                    fontSize: 14,
                    fontFamily: 'Cascadia Code, Consolas, Monaco, monospace',
                    theme: {
                        background: '#1e1e1e',
                        foreground: '#d4d4d4',
                        cursor: '#ffffff',
                        selection: '#264f78',
                    },
                    scrollback: 10000,
                    convertEol: true,
                });

                // Add fit addon
                this.fitAddon = new FitAddon.FitAddon();
                this.terminal.loadAddon(this.fitAddon);

                // Add web links addon
                this.terminal.loadAddon(new WebLinksAddon.WebLinksAddon());

                // Open terminal
                const container = document.getElementById('terminal-container');
                this.terminal.open(container);
                this.fitAddon.fit();

                // Handle resize
                window.addEventListener('resize', () => this.fitAddon.fit());

                // Disable browser's native paste handling - xterm.js handles paste internally
                document.addEventListener('paste', (e) => {
                    // Only prevent if terminal is focused/active
                    const activeElement = document.activeElement;
                    const terminalElement = container.querySelector('.xterm');
                    if (terminalElement && terminalElement.contains(activeElement)) {
                        // Prevent browser's default paste (which may show permission dialog)
                        e.preventDefault();
                        e.stopPropagation();
                        // xterm.js will handle paste through its own onData mechanism
                    }
                });

                // Create SignalR connection
                this.connection = new signalR.HubConnectionBuilder()
                    .withUrl('/hubs/terminal')
                    .withAutomaticReconnect()
                    .configureLogging(signalR.LogLevel.Information)
                    .build();

                this.setupEventHandlers();

                // Connect
                try {
                    await this.connection.start();
                    this.isConnected = true;
                    this.updateStatus('Connected', true);
                    this.terminal.writeln('\x1b[32m✓ Connected to terminal hub\x1b[0m\r\n');
                    this.terminal.writeln('Click "New Session" to start a Claude instance.\r\n');
                } catch (err) {
                    console.error('Connection failed:', err);
                    this.terminal.writeln('\x1b[31m✗ Failed to connect to terminal hub\x1b[0m');
                    this.terminal.writeln('\x1b[90mMake sure the Hazina API is running.\x1b[0m');
                }
            }

            setupEventHandlers() {
                // Receive output
                this.connection.on('OnOutput', (sessionId, data) => {
                    if (sessionId === this.currentSessionId) {
                        // Convert array to Uint8Array and write
                        const bytes = new Uint8Array(data);
                        this.terminal.write(bytes);
                    }
                });

                // Process exited
                this.connection.on('OnExit', (sessionId, exitCode) => {
                    if (sessionId === this.currentSessionId) {
                        this.terminal.writeln(`\r\n\x1b[90m[Process exited with code ${exitCode}]\x1b[0m`);
                    }
                });

                // Error
                this.connection.on('OnError', (sessionId, error) => {
                    this.terminal.writeln(`\r\n\x1b[31m[Error: ${error}]\x1b[0m`);
                });

                // User input - send to process
                this.terminal.onData(data => {
                    if (this.currentSessionId && this.isConnected) {
                        const encoder = new TextEncoder();
                        const bytes = Array.from(encoder.encode(data));
                        this.connection.invoke('SendInput', this.currentSessionId, bytes)
                            .catch(err => console.error('Failed to send input:', err));
                    }
                });

                // Resize
                this.terminal.onResize(({ cols, rows }) => {
                    if (this.currentSessionId && this.isConnected) {
                        this.connection.invoke('Resize', this.currentSessionId, cols, rows);
                    }
                });

                // Connection events
                this.connection.onreconnecting(() => {
                    this.updateStatus('Reconnecting...', false);
                });

                this.connection.onreconnected(() => {
                    this.updateStatus('Connected', true);
                    if (this.currentSessionId) {
                        this.connection.invoke('JoinSession', this.currentSessionId);
                    }
                });

                this.connection.onclose(() => {
                    this.isConnected = false;
                    this.updateStatus('Disconnected', false);
                });
            }

            async startSession() {
                if (!this.isConnected) {
                    this.terminal.writeln('\x1b[31mNot connected to hub\x1b[0m');
                    return;
                }

                const command = document.getElementById('command').value || 'claude';
                const workingDir = document.getElementById('working-dir').value || undefined;
                const argsStr = document.getElementById('arguments').value;
                const args = argsStr ? argsStr.split(' ').filter(a => a) : [];

                const request = {
                    command: command,
                    arguments: args,
                    workingDirectory: workingDir,
                    columns: this.terminal.cols,
                    rows: this.terminal.rows,
                    mergeStderr: true,
                };

                try {
                    const sessionInfo = await this.connection.invoke('StartSession', request);
                    this.currentSessionId = sessionInfo.sessionId;
                    document.getElementById('session-id').textContent = sessionInfo.sessionId;

                    this.terminal.clear();
                    this.terminal.writeln(`\x1b[90m[Session ${sessionInfo.sessionId} started]\x1b[0m`);
                    this.terminal.writeln(`\x1b[90m[Running: ${command} ${args.join(' ')}]\x1b[0m\r\n`);
                } catch (err) {
                    console.error('Failed to start session:', err);
                    this.terminal.writeln(`\x1b[31mFailed to start session: ${err.message}\x1b[0m`);
                }
            }

            async sendInterrupt() {
                if (this.currentSessionId && this.isConnected) {
                    await this.connection.invoke('SendSignal', this.currentSessionId, 'interrupt');
                    this.terminal.writeln('\r\n\x1b[33m[Sent Ctrl+C]\x1b[0m');
                }
            }

            async terminate() {
                if (this.currentSessionId && this.isConnected) {
                    await this.connection.invoke('Terminate', this.currentSessionId);
                    this.terminal.writeln('\r\n\x1b[31m[Session terminated]\x1b[0m');
                    this.currentSessionId = null;
                    document.getElementById('session-id').textContent = 'None';
                }
            }

            updateStatus(text, connected) {
                const statusEl = document.getElementById('status');
                statusEl.textContent = text;
                statusEl.className = connected ? 'connected' : 'disconnected';
            }
        }

        // Initialize
        const client = new ClaudeTerminal();
        client.init();

        // Button handlers
        document.getElementById('btn-new-session').addEventListener('click', () => client.startSession());
        document.getElementById('btn-interrupt').addEventListener('click', () => client.sendInterrupt());
        document.getElementById('btn-terminate').addEventListener('click', () => client.terminate());

        // Keyboard shortcut for Ctrl+C (when terminal not focused)
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'c' && document.activeElement.tagName !== 'INPUT') {
                client.sendInterrupt();
            }
        });

        // Voice Control Implementation
        class VoiceControl {
            constructor(terminal) {
                this.terminal = terminal;
                this.recognition = null;
                this.isListening = false;
                this.isSupported = false;
                this.finalTranscript = '';

                this.btnVoice = document.getElementById('btn-voice');
                this.btnText = document.getElementById('voice-btn-text');
                this.statusEl = document.getElementById('voice-status');

                this.init();
            }

            init() {
                // Check for Web Speech API support
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

                if (!SpeechRecognition) {
                    this.isSupported = false;
                    this.btnVoice.disabled = true;
                    this.btnVoice.title = 'Voice input not supported in this browser';
                    this.btnText.textContent = 'No Voice';
                    this.statusEl.textContent = 'Use Chrome/Edge for voice';
                    return;
                }

                this.isSupported = true;
                this.recognition = new SpeechRecognition();

                // Configure recognition
                this.recognition.continuous = true;
                this.recognition.interimResults = true;
                this.recognition.lang = 'en-US';

                // Event handlers
                this.recognition.onstart = () => this.onRecognitionStart();
                this.recognition.onend = () => this.onRecognitionEnd();
                this.recognition.onresult = (event) => this.onRecognitionResult(event);
                this.recognition.onerror = (event) => this.onRecognitionError(event);
                this.recognition.onnomatch = () => this.onNoMatch();

                // Set up button handlers
                this.setupButtonHandlers();
            }

            setupButtonHandlers() {
                // Click to toggle
                this.btnVoice.addEventListener('click', (e) => {
                    e.preventDefault();
                    this.toggle();
                });

                // Space bar to toggle when button is focused
                this.btnVoice.addEventListener('keydown', (e) => {
                    if (e.key === ' ' || e.key === 'Enter') {
                        e.preventDefault();
                        this.toggle();
                    }
                });

                // Global keyboard shortcut: Ctrl+M to toggle voice
                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey && e.key === 'm') {
                        e.preventDefault();
                        this.toggle();
                    }
                });
            }

            toggle() {
                if (!this.isSupported) {
                    this.terminal.terminal.writeln('\r\n\x1b[33m[Voice input not supported - use Chrome or Edge]\x1b[0m');
                    return;
                }

                if (this.isListening) {
                    this.stop();
                } else {
                    this.start();
                }
            }

            start() {
                if (this.isListening) return;

                try {
                    this.finalTranscript = '';
                    this.recognition.start();
                } catch (err) {
                    console.error('Failed to start recognition:', err);
                    this.terminal.terminal.writeln('\r\n\x1b[31m[Voice: Failed to start - ' + err.message + ']\x1b[0m');
                }
            }

            stop() {
                if (!this.isListening) return;

                try {
                    this.recognition.stop();
                } catch (err) {
                    console.error('Failed to stop recognition:', err);
                }
            }

            onRecognitionStart() {
                this.isListening = true;
                this.btnVoice.classList.add('recording');
                this.btnText.textContent = 'Stop';
                this.statusEl.textContent = 'Listening...';
                this.statusEl.className = 'voice-status listening';

                this.terminal.terminal.writeln('\r\n\x1b[36m[Voice: Listening... speak now]\x1b[0m');
            }

            onRecognitionEnd() {
                this.isListening = false;
                this.btnVoice.classList.remove('recording');
                this.btnText.textContent = 'Voice';
                this.statusEl.textContent = '';
                this.statusEl.className = 'voice-status';

                // Send final transcript if we have one
                if (this.finalTranscript.trim()) {
                    this.sendToTerminal(this.finalTranscript.trim());
                }
            }

            onRecognitionResult(event) {
                let interimTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const result = event.results[i];
                    if (result.isFinal) {
                        this.finalTranscript += result[0].transcript;
                    } else {
                        interimTranscript += result[0].transcript;
                    }
                }

                // Update status with interim results
                if (interimTranscript) {
                    this.statusEl.textContent = interimTranscript.substring(0, 40) + (interimTranscript.length > 40 ? '...' : '');
                    this.statusEl.className = 'voice-status processing';
                }
            }

            onRecognitionError(event) {
                console.error('Recognition error:', event.error);

                let errorMessage = event.error;
                switch (event.error) {
                    case 'no-speech':
                        errorMessage = 'No speech detected';
                        break;
                    case 'audio-capture':
                        errorMessage = 'No microphone found';
                        break;
                    case 'not-allowed':
                        errorMessage = 'Microphone permission denied';
                        break;
                    case 'network':
                        errorMessage = 'Network error';
                        break;
                    case 'aborted':
                        // User stopped, not an error
                        return;
                }

                this.terminal.terminal.writeln(`\r\n\x1b[31m[Voice Error: ${errorMessage}]\x1b[0m`);
                this.statusEl.textContent = errorMessage;
            }

            onNoMatch() {
                this.terminal.terminal.writeln('\r\n\x1b[33m[Voice: Could not understand speech]\x1b[0m');
            }

            sendToTerminal(text) {
                if (!this.terminal.currentSessionId || !this.terminal.isConnected) {
                    this.terminal.terminal.writeln('\r\n\x1b[33m[Voice: No active session - start a session first]\x1b[0m');
                    return;
                }

                // Show what we're sending
                this.terminal.terminal.writeln(`\r\n\x1b[32m[Voice Input: "${text}"]\x1b[0m`);

                // Send via SignalR (add newline to submit)
                this.terminal.connection.invoke('SendInputText', this.terminal.currentSessionId, text + '\n')
                    .then(() => {
                        console.log('Voice input sent successfully');
                    })
                    .catch(err => {
                        console.error('Failed to send voice input:', err);
                        this.terminal.terminal.writeln(`\r\n\x1b[31m[Voice: Failed to send - ${err.message}]\x1b[0m`);
                    });
            }
        }

        // Initialize voice control after terminal is ready
        const voiceControl = new VoiceControl(client);

        // Session List Management
        class SessionListManager {
            constructor(client) {
                this.client = client;
                this.sessions = new Map();
                this.listElement = document.getElementById('session-list');
                this.setupAutoRefresh();
            }

            setupAutoRefresh() {
                // Refresh session list every 2 seconds
                setInterval(() => this.refreshSessions(), 2000);
                // Initial load
                this.refreshSessions();
            }

            async refreshSessions() {
                if (!this.client.isConnected) return;

                try {
                    const sessions = await this.client.connection.invoke('GetSessions');
                    this.updateSessionList(sessions);
                } catch (err) {
                    console.error('Failed to get sessions:', err);
                }
            }

            updateSessionList(sessions) {
                // Remove sessions that no longer exist
                const sessionIds = new Set(sessions.map(s => s.sessionId));
                for (const [id, element] of this.sessions.entries()) {
                    if (!sessionIds.has(id)) {
                        element.remove();
                        this.sessions.delete(id);
                    }
                }

                // Add or update sessions
                sessions.forEach(session => {
                    let element = this.sessions.get(session.sessionId);
                    if (!element) {
                        element = this.createSessionElement(session);
                        this.listElement.appendChild(element);
                        this.sessions.set(session.sessionId, element);
                    } else {
                        this.updateSessionElement(element, session);
                    }

                    // Mark active session
                    if (session.sessionId === this.client.currentSessionId) {
                        element.classList.add('active');
                    } else {
                        element.classList.remove('active');
                    }
                });
            }

            createSessionElement(session) {
                const element = document.createElement('div');
                element.className = 'session-item';
                element.dataset.sessionId = session.sessionId;

                element.addEventListener('click', () => {
                    this.switchToSession(session.sessionId);
                });

                this.updateSessionElement(element, session);
                return element;
            }

            updateSessionElement(element, session) {
                const status = session.isRunning ? 'running' : 'exited';
                const statusClass = session.isRunning ? 'running' : 'exited';

                // Truncate command if too long
                const command = session.command.length > 30
                    ? session.command.substring(0, 27) + '...'
                    : session.command;

                element.innerHTML = `
                    <div class="session-title">${command}</div>
                    <div class="session-meta">
                        <span class="session-status ${statusClass}">${status}</span>
                        <span style="margin-left: 0.5rem;">${session.sessionId.substring(0, 8)}</span>
                    </div>
                    <div class="session-meta" style="font-size: 0.625rem;">
                        ${new Date(session.startedAt).toLocaleTimeString()}
                    </div>
                `;
            }

            async switchToSession(sessionId) {
                try {
                    const success = await this.client.connection.invoke('JoinSession', sessionId);
                    if (success) {
                        this.client.currentSessionId = sessionId;
                        this.client.terminal.clear();
                        this.client.terminal.writeln(`\x1b[32m✓ Switched to session ${sessionId}\x1b[0m\r\n`);
                        document.getElementById('session-id').textContent = sessionId;
                        this.refreshSessions(); // Update active indicator

                        // Mobile: Show terminal, hide session list
                        document.querySelector('.app-container').classList.add('session-active');
                    }
                } catch (err) {
                    console.error('Failed to switch session:', err);
                    this.client.terminal.writeln(`\x1b[31m✗ Failed to switch to session ${sessionId}\x1b[0m`);
                }
            }

            removeSession(sessionId) {
                const element = this.sessions.get(sessionId);
                if (element) {
                    element.remove();
                    this.sessions.delete(sessionId);
                }
            }
        }

        // Initialize session list manager
        const sessionListManager = new SessionListManager(client);

        // Modify terminate button to remove from list
        const originalTerminate = client.terminate.bind(client);
        client.terminate = async function() {
            const sessionId = this.currentSessionId;
            await originalTerminate();
            if (sessionId) {
                // Remove from list immediately
                sessionListManager.removeSession(sessionId);
            }
        };

        // Mobile back button handler
        document.getElementById('btn-back').addEventListener('click', () => {
            document.querySelector('.app-container').classList.remove('session-active');
        });
    </script>
        </div>
    </div>
</body>
