version: '3.8'

services:
  # PostgreSQL database for embeddings and document storage
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hazina-postgres
    environment:
      POSTGRES_USER: hazina
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hazina_dev_password}
      POSTGRES_DB: hazina
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hazina"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hazina-network

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: hazina-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "5775:5775/udp"   # Zipkin compatible endpoint (deprecated)
      - "6831:6831/udp"   # Jaeger Thrift Compact
      - "6832:6832/udp"   # Jaeger Thrift Binary
      - "5778:5778"       # Serve configs
      - "16686:16686"     # Jaeger UI
      - "14250:14250"     # gRPC
      - "14268:14268"     # HTTP Thrift
      - "14269:14269"     # Admin port
      - "4317:4317"       # OTLP gRPC
      - "4318:4318"       # OTLP HTTP
    networks:
      - hazina-network

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: hazina-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - hazina-network

  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:10.2.3
    container_name: hazina-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    depends_on:
      - prometheus
      - jaeger
    networks:
      - hazina-network

  # Redis for caching (optional)
  redis:
    image: redis:7.2-alpine
    container_name: hazina-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - hazina-network

  # Example Hazina CLI application
  # hazina-cli:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #     args:
  #       PROJECT_PATH: apps/CLI/Hazina.App.ClaudeCode
  #       PROJECT_NAME: Hazina.App.ClaudeCode
  #   container_name: hazina-cli
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Production
  #     - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=hazina;Username=hazina;Password=${POSTGRES_PASSWORD:-hazina_dev_password}
  #     - OpenTelemetry__OtlpEndpoint=http://jaeger:4317
  #     - OPENAI_API_KEY=${OPENAI_API_KEY}
  #     - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     jaeger:
  #       condition: service_started
  #   networks:
  #     - hazina-network
  #   command: ["Hazina.App.ClaudeCode.dll"]

  # Example Hazina Web application
  # hazina-web:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #     args:
  #       PROJECT_PATH: apps/Web/Hazina.App.HtmlMockupGenerator
  #       PROJECT_NAME: Hazina.App.HtmlMockupGenerator
  #   container_name: hazina-web
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Production
  #     - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=hazina;Username=hazina;Password=${POSTGRES_PASSWORD:-hazina_dev_password}
  #     - OpenTelemetry__OtlpEndpoint=http://jaeger:4317
  #     - OPENAI_API_KEY=${OPENAI_API_KEY}
  #     - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     jaeger:
  #       condition: service_started
  #   networks:
  #     - hazina-network
  #   command: ["Hazina.App.HtmlMockupGenerator.dll"]

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  redis_data:

networks:
  hazina-network:
    driver: bridge
